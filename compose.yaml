services:
  chess-server:
    build:
      context: .
    restart: unless-stopped
    environment:
      CHESS_SERVER_ADDR: 0.0.0.0:3000
      CHESS_SERVER_STATE: /var/lib/terminal-chess/server-state.json
      CHESS_SERVER_DB: /var/lib/terminal-chess/chess.db
      CHESS_SSH_ADDR: 0.0.0.0:2222
      CHESS_SSH_HOST_KEY: /var/lib/terminal-chess/ssh_host_ed25519_key
      CHESS_SSH_MAX_SESSIONS: ${CHESS_SSH_MAX_SESSIONS:-60}
      CHESS_SSH_MAX_PER_IP: ${CHESS_SSH_MAX_PER_IP:-3}
      CHESS_RATE_LIMIT_PER_10S: ${CHESS_RATE_LIMIT_PER_10S:-60}
      CHESS_LOG_FORMAT: json
      RUST_LOG: ${RUST_LOG:-chess_server=info}
    expose:
      - "3000"
    ports:
      # `ssh chess.example.com` lands in the game. Move the host's own sshd
      # to another port first (see deploy/README.md).
      - "${SSH_PORT:-22}:2222"
    volumes:
      - chess-data:/var/lib/terminal-chess
    # Every SSH visitor's game and engine run in here, so a busy evening
    # cannot starve whatever else the host runs. A visitor playing the engine
    # takes about 25 MB; keep CHESS_SSH_MAX_SESSIONS within the memory.
    cpus: ${CHESS_CPUS:-2}
    mem_limit: ${CHESS_MEMORY:-2g}
    pids_limit: 1024
    # Visitors reach a program running in here, so give it nothing it does
    # not use: no Linux capabilities, no setuid escalation, and no writable
    # image. The data volume and /tmp, where each visitor's settings and
    # autosave live until they leave, are the only writable places.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - chess-server
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cpus: 0.5
    mem_limit: 256m
    # Caddy's binary carries the one capability it needs, binding 80 and 443;
    # it cannot start if that capability is dropped too.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m

volumes:
  chess-data:
  caddy-data:
  caddy-config:
