[package]
name = "chess"
version = "0.1.0"
edition = "2021"
description = "Play chess in your terminal"

[[bin]]
name = "chess"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false }
resvg = { version = "0.48.1", default-features = false }
viuer = "0.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
