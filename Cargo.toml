[workspace]
members = ["crates/chess-core", "crates/chess-protocol", "crates/chess-server"]
# Plain `cargo build`, `cargo test`, and `cargo clippy` cover every crate.
default-members = [".", "crates/chess-core", "crates/chess-protocol", "crates/chess-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
chess-protocol = { path = "crates/chess-protocol" }
chess-server = { path = "crates/chess-server" }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[package]
name = "chess"
version.workspace = true
edition.workspace = true
description = "Play chess in your terminal"
default-run = "chess"

[[bin]]
name = "chess"
path = "src/main.rs"

[dependencies]
chess-core.workspace = true
chess-protocol.workspace = true
crossterm = "0.29.0"
futures-util.workspace = true
image = { version = "0.25.10", default-features = false }
resvg = { version = "0.48.1", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
viuer = "0.11.0"

[dev-dependencies]
chess-server.workspace = true

# Rules and search are hot loops; optimize them even in debug builds so the
# engine plays at a normal pace and perft tests stay fast.
[profile.dev.package.chess-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
